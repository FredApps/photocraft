name: Documentation
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 15
    name: mdBook build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - name: Install mdBook
      run: cargo install mdbook --version 0.4.52 --locked
    - name: Build documentation
      run: mdbook build book
