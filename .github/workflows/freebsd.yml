name: FreeBSD
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  freebsd:
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@5cd19d05cb07bb389d82d0e200d9ee5f418f332f
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      cargo-build-extra-args: --features heif
      custom-test-command: CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked --features heif --exclude photocraft-ui-egui --exclude photocraft-gpu && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p photocraft-gpu --locked -- --test-threads=1 && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p photocraft-ui-egui --locked --lib && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p photocraft-ui-egui --locked --doc && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p photocraft-ui-egui --locked --test '*' -- --test-threads=1
      run-package-check: true
