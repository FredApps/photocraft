name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch:
    inputs:
      selection_morphology:
        description: Compare selection morphology on 36 MP (Linux, exact outputs)
        type: boolean
        default: false
      fuzz:
        description: Run the fuzz job
        type: boolean
        default: false
      fuzz_seconds:
        description: Seconds per fuzz target
        default: '600'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PHOTOCRAFT_NO_PRINT: '1'
  LPDEST: photocraft-no-such-printer
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platforms:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    timeout-minutes: 10
    name: select platforms
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
      web: ${{ steps.pick.outputs.web }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Git dependencies come from storytold
      run: "set -euo pipefail\ntest -f Cargo.lock || { echo \"Cargo.lock is missing\"; exit 1; }\n# Source replacement, patches and path overrides in cargo config never show up\n# in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.\n# Cargo still reads the legacy .cargo/config.\npython3 - <<'PY'\nimport os, sys, tomllib\nfor path in (\".cargo/config\", \".cargo/config.toml\"):\n    if not os.path.exists(path):\n        continue\n    config = tomllib.load(open(path, \"rb\"))\n    replaced = [name for name, source in config.get(\"source\", {}).items()\n                if isinstance(source, dict) and \"replace-with\" in source]\n    if replaced or \"patch\" in config or \"paths\" in config:\n        print(f\"{path} replaces, patches or overrides a source\")\n        sys.exit(1)\nPY\n# Fails when Cargo.lock is out of date with the manifests.\ncargo metadata --locked --format-version 1 > /dev/null\npython3 - <<'PY'\nimport sys, tomllib\nlock = tomllib.load(open(\"Cargo.lock\"\
        , \"rb\"))\nbad = sorted({p[\"source\"] for p in lock.get(\"package\", [])\n              if p.get(\"source\", \"\").startswith(\"git+\")\n              and not p[\"source\"].startswith(\"git+https://github.com/storytold/\")})\nif bad:\n    print(\"Git dependencies outside github.com/storytold:\", *bad, sep=\"\\n\")\n    sys.exit(1)\nPY\n"
    - id: pick
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: "if [ \"$EVENT\" != pull_request ] || [ \"$FULL\" = true ]; then\n  echo \"windows=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"web=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n# The browser build (a fat-LTO wasm build) runs only when something it compiles or\n# packages changed: the web app and its packaging, crate sources and manifests (the web\n# build compiles nearly every crate), the workspace manifests and this workflow.\nif git diff --name-only \"$BASE\" HEAD | grep -Eq '^(apps/photocraft-web(-boot)?/|packaging/web/|packaging/env\\.sh$|crates/[^/]+/(src/|Cargo\\.toml$|build\\.rs$)|Cargo\\.(toml|lock)$|rust-toolchain(\\.toml)?$|\\.github/workflows/ci\\.yml$)'; then\n  echo \"web=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"web=false\" >> \"$GITHUB_OUTPUT\"\nfi\nif git diff --name-only \"$BASE\" HEAD | grep -Eq '^(apps/|crates/(ui-egui|text|gpu|tablet|heif|format)/|Cargo\\.lock$|(.*/)?build\\.rs$|\\.github/workflows/ci\\.yml$)'; then\n  echo \"windows=true\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"windows=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
  gate:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8bb4e5ab95443171104ad88113fe1ef9b0e5ce3f
    with:
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      dev-debug: ''
      env: 'PHOTOCRAFT_NO_PRINT=1

        LPDEST=photocraft-no-such-printer

        '
      timeout-minutes: 100
      command: cargo xtask ci
  windows:
    needs:
    - platforms
    if: needs.platforms.outputs.windows == 'true'
    timeout-minutes: 100
    name: test (windows-latest, ${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part:
        - unit
        - integration
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check out craft-fonts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: storytold/craft-fonts
        ref: b076417b5880bd4154bd22f00695b1d28c6bea83
        path: craft-fonts
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'integration' }}
        cache-on-failure: true
    - name: Install sccache
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - name: Use sccache
      env:
        MAIN: ${{ github.ref == 'refs/heads/main' }}
      run: 'echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

        if [ "$MAIN" != true ]; then echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"; fi

        '
      shell: bash
    - name: Clippy
      if: matrix.part == 'integration'
      run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings
    - name: Dependency layering
      if: matrix.part == 'integration'
      run: cargo xtask layers
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
      with:
        tool: cargo-nextest@0.9.150
    - name: Test
      env:
        PART: ${{ matrix.part }}
      run: "case \"$PART\" in\n  unit) targets=(--lib --bins) ;;\n  *) targets=(--test '*') ;;\nesac\ncargo nextest run --profile ci --workspace --locked --features heif \"${targets[@]}\"\n"
      shell: bash
    - name: Doctests
      if: matrix.part == 'unit'
      run: cargo test --workspace --locked --features heif --doc
  test-without-heif:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    timeout-minutes: 60
    name: test (without heif)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Linux build dependencies
      uses: storytold/craft-common-actions/actions/install-apt-packages@main
      with:
        packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: v1-rust
        shared-key: ${{ hashFiles('Cargo.toml') }}-gate
        save-if: false
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
      with:
        tool: cargo-nextest@0.9.150
    - name: Test without heif
      run: cargo nextest run -p photocraft-heif -p photocraft-codecs -p photocraft-io --locked --profile ci
  corpus:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    timeout-minutes: 30
    name: corpus tests
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: corpus
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - name: Restore test corpora
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: corpus/
        key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
    - name: Fetch and verify corpora
      run: cargo xtask corpus --all
    - name: Corpus tests
      run: cargo xtask test-corpus
  web:
    timeout-minutes: 60
    name: web build and wasm size gate
    needs:
    - platforms
    if: needs.platforms.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: ci-web
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - name: Install trunk
      run: "curl --proto '=https' -fsSL \"https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz\" \\\n  | tar -xz -C \"$HOME/.cargo/bin\" trunk\ntrunk --version\n"
    - name: Build and verify browser release
      run: packaging/web/package.sh
    - name: Report wasm size
      if: success()
      run: "{\n  echo \"### Browser WebAssembly size\"\n  echo\n  echo \"| File | Bytes | MiB | Limit |\"\n  echo \"| --- | ---: | ---: | ---: |\"\n  row() { echo \"| $1 | $2 | $(awk -v n=\"$2\" 'BEGIN { printf \"%.2f\", n / 1048576 }') | $3 |\"; }\n  # The app's wasm as built; it ships gzipped in parts, so only the download grows with it.\n  for wasm in dist/web/*.wasm; do\n    [ -f \"$wasm\" ] || continue\n    row \"$(basename \"$wasm\")\" \"$(wc -c < \"$wasm\" | tr -d ' ')\" \"none\"\n  done\n  # What a host sees: the largest file of the packaged site.\n  largest=$(find target/web-package -type f -printf '%s %f\\n' | sort -n | tail -1)\n  row \"largest file in the site: ${largest#* }\" \"${largest%% *}\" \"24 MiB\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  fuzz:
    timeout-minutes: 60
    name: fuzz (${{ matrix.target.crate }}/${{ matrix.target.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
        - crate: psd
          name: parse
        - crate: psd
          name: descriptor
        - crate: psd
          name: image_source_data
        - crate: psd
          name: grd
        - crate: psd
          name: ase
        - crate: psd
          name: aco
        - crate: psd
          name: patterns
        - crate: psd
          name: filter_effects
        - crate: psd
          name: metadata
        - crate: psd
          name: tagged
        - crate: psd
          name: resources
        - crate: psd
          name: asl
        - crate: codecs
          name: decode_any
        - crate: codecs
          name: decode_png
        - crate: codecs
          name: decode_jpeg
        - crate: codecs
          name: decode_tiff
        - crate: codecs
          name: decode_exr
        - crate: codecs
          name: decode_heif
        - crate: affinity
          name: preview
        - crate: affinity
          name: import_preview
          args: --features io
        - crate: format
          name: load
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: crates/${{ matrix.target.crate }}/fuzz
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    - name: Fuzz
      working-directory: crates/${{ matrix.target.crate }}
      env:
        FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
      run: cargo fuzz run ${{ matrix.target.name }} ${{ matrix.target.args }} -- -max_total_time="$FUZZ_SECONDS"
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fuzz-${{ matrix.target.crate }}-${{ matrix.target.name }}
        path: crates/${{ matrix.target.crate }}/fuzz/artifacts
  selection-morphology:
    if: inputs.selection_morphology == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAYON_NUM_THREADS: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Linux build dependencies
      uses: storytold/craft-common-actions/actions/install-apt-packages@main
      with:
        packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: selection-morphology-perf
    - name: Compare exact outputs and release timings on 36 MP
      run: 'set -o pipefail

        cargo run --release -p photocraft-algo --example bench_selection_morphology | tee selection-morphology-perf.txt

        '
    - name: Compare cropped command reads and writeback on 36 MP
      run: 'set -o pipefail

        cargo test --release -p photocraft-engine --lib sparse_modify_release_comparison -- --ignored --nocapture | tee -a selection-morphology-perf.txt

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: selection-morphology-performance
        path: selection-morphology-perf.txt
  selection-morphology-quick-perf:
    if: inputs.selection_morphology == true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: perf-release
    - name: Quick performance suite
      run: cargo xtask perf --quick
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: selection-morphology-quick-perf
        path: 'target/perf/*.json

          target/perf/summary.md

          '
