name: Packaging lint
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@be6bbf3ca5a5de466786908b3986163da7c05314
  verified-appimage-inputs:
    timeout-minutes: 10
    name: Verified AppImage inputs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - run: bash packaging/linux/verified-download-test.sh
